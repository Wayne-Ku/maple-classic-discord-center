name: Check Maple Classic announcements

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send the latest announcement as a webhook test"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maple-classic-announcement-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore announcement state
        id: state_restore
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: maple-state-${{ github.ref_name }}-restore
          restore-keys: |
            maple-state-${{ github.ref_name }}-

      - name: Record state before check
        id: state_before
        shell: bash
        run: |
          if [[ -f data/state.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "sha256=$(sha256sum data/state.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "sha256=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check and send announcements
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
          STATE_FILE: data/state.json
        run: python app.py

      - name: Detect state changes
        id: state_after
        if: success()
        shell: bash
        run: |
          if [[ -f data/state.json ]]; then
            state_hash=$(sha256sum data/state.json | awk '{print $1}')
            echo "sha256=$state_hash" >> "$GITHUB_OUTPUT"
            if [[ "${{ steps.state_before.outputs.exists }}" != "true" || "$state_hash" != "${{ steps.state_before.outputs.sha256 }}" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save announcement state
        if: success() && steps.state_after.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: maple-state-${{ github.ref_name }}-${{ steps.state_after.outputs.sha256 }}
