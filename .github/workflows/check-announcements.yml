name: Check Maple Classic announcements
run-name: ${{ inputs.slot_id && format('公告時段 {0}-{1}', inputs.slot_id, inputs.attempt) || 'Check Maple Classic announcements' }}

on:
  workflow_dispatch:
    inputs:
      slot_id:
        description: "Cloudflare scheduler slot"
        required: false
        type: string
      attempt:
        description: "Cloudflare dispatch attempt"
        required: false
        type: string
      test_mode:
        description: "Send the latest announcement as a webhook test"
        required: false
        type: boolean
        default: false
      initialize_state:
        description: "Initialize missing state only (skips existing announcement history)"
        required: false
        type: boolean
        default: false
      cleanup_announcement_id:
        description: "Delete obsolete webhook copies for this announcement ID"
        required: false
        type: string
        default: ""
      keep_message_id:
        description: "Discord message ID to keep during cleanup"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: maple-classic-announcement-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Decide announcement cadence
        id: cadence
        shell: bash
        env:
          SLOT_ID: ${{ inputs.slot_id || '' }}
        run: |
          if [[ -z "$SLOT_ID" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: running announcement check."
          elif [[ "$SLOT_ID" =~ ^[0-9]+$ ]] && (( (SLOT_ID / 60000) % 60 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Hourly Cloudflare slot: running announcement check."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Non-hourly Cloudflare slot: skipping announcement check."
          fi

      - name: Check out repository
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Restore announcement state
        id: state_restore
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: data/state.json
          key: maple-state-${{ github.ref_name }}-restore
          restore-keys: |
            maple-state-${{ github.ref_name }}-

      - name: Record state before check
        id: state_before
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          if [[ -f data/state.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "sha256=$(sha256sum data/state.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "sha256=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check and send announcements
        if: steps.cadence.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
          STATE_FILE: data/state.json
          REQUIRE_EXISTING_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_state && 'false' || 'true' }}
          CLEANUP_ANNOUNCEMENT_ID: ${{ inputs.cleanup_announcement_id || '' }}
          KEEP_MESSAGE_ID: ${{ inputs.keep_message_id || '' }}
        shell: bash
        run: |
          if [[ -n "$CLEANUP_ANNOUNCEMENT_ID" ]]; then
            python tools/cleanup_discord_announcement.py \
              --id "$CLEANUP_ANNOUNCEMENT_ID" \
              --keep-message-id "$KEEP_MESSAGE_ID"
          else
            python app.py
          fi

      - name: Detect state changes
        id: state_after
        if: always() && steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          if [[ -f data/state.json ]]; then
            state_hash=$(sha256sum data/state.json | awk '{print $1}')
            python -c "from pathlib import Path; from state_store import load_state; load_state(Path('data/state.json'))"
            echo "sha256=$state_hash" >> "$GITHUB_OUTPUT"
            if [[ "${{ steps.state_before.outputs.exists }}" != "true" || "$state_hash" != "${{ steps.state_before.outputs.sha256 }}" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save announcement state
        if: always() && steps.cadence.outputs.run == 'true' && steps.state_after.outputs.changed == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: data/state.json
          key: maple-state-${{ github.ref_name }}-${{ steps.state_after.outputs.sha256 }}
